<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan lekcji 2026/27 – propozycja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --font-default: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-primary: "Montserrat", sans-serif;
  --color-primary: #272A22;
  --color-tekst: #6c757d;
  --bg-topbar: #434A38;
  --bg-section: #f6f6f6;
  --color-secondary: #f85a40;
}
body { font-family: var(--font-default); background: var(--bg-section); color: #222; }
.topbar { background: var(--bg-topbar); color: #fff; font-size: 14px; min-height: 40px; display: flex; align-items: center; }
.header { background: var(--color-primary); min-height: 70px; display: flex; align-items: center; }
.header .brand { font-family: var(--font-primary); color: #fff; font-size: 26px; font-weight: 700; letter-spacing: .5px; }
.header .brand span { color: var(--color-secondary); }
.tytul { font-family: var(--font-primary); font-size: 48px; font-weight: 700; margin: 20px 0; color: var(--color-tekst); text-align: center; }
@media (max-width: 576px) { .tytul { font-size: 30px; } }
.panel { background: #fff; border-radius: 6px; padding: 16px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.panel label { font-family: var(--font-primary); font-weight: 600; font-size: 13px; color: var(--color-tekst); text-transform: uppercase; letter-spacing: .5px; }
.btn-plan { border: 1px solid var(--bg-topbar); color: var(--bg-topbar); font-weight: 600; }
.btn-plan.active, .btn-plan:hover { background: var(--bg-topbar); color: #fff; }
.table td, .table th { white-space: nowrap; font-size: 14px; }
.table thead th { font-family: var(--font-primary); }
.table td.zmiana { box-shadow: inset 0 0 0 2px var(--color-secondary); }
.legenda { font-size: 13px; color: var(--color-tekst); }
.legenda i { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; box-shadow: inset 0 0 0 2px var(--color-secondary); background: #212529; }
.stopka { background: var(--color-primary); color: rgba(255,255,255,.7); font-size: 13px; }
</style>
</head>
<body>
<header class="header"><div class="container"><div class="brand">Plan lekcji <span>2026/27</span></div></div></header>

<main class="container py-4">
  <div class="panel mb-3">
    <div class="row g-3 align-items-end">
      <div class="col-lg-4">
        <label class="d-block mb-1">Wersja planu</label>
        <div class="btn-group" role="group" aria-label="Wersja planu">
          <button type="button" class="btn btn-plan" data-plan="real">Plan obecny</button>
          <button type="button" class="btn btn-plan" data-plan="hard">Plan zoptymalizowany</button>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <label for="sel-oddzial" class="d-block mb-1">Oddział</label>
        <select id="sel-oddzial" class="form-select"></select>
      </div>
      <div class="col-sm-6 col-lg-3">
        <label for="sel-nauczyciel" class="d-block mb-1">Nauczyciel</label>
        <select id="sel-nauczyciel" class="form-select"></select>
      </div>
    </div>
    <div class="row g-3 mt-1" id="grupy"></div>
  </div>

  <p class="tytul" id="tytul">Plan lekcji</p>
  <div class="table-responsive"><table class="table table-dark table-hover" id="plan"></table></div>
  <p class="legenda" id="legenda"><i></i>Lekcja w innym terminie niż w obecnym planie</p>
</main>
<footer class="stopka py-3"><div class="container">Plan wygenerowany solverem CP-SAT na podstawie planu opublikowanego na koper.edu.pl.</div></footer>

const GODZ = ["7.10 - 7.55", "8.00 - 8.45", "8.50 - 9.35", "9.40 - 10.25", "10.35 - 11.20", "11.30 - 12.15", "12.25 - 13.10", "13.25 - 14.10", "14.15 - 15.00", "15.05 - 15.50"];
const DNI = ["Pn", "Wt", "Śr", "Cz", "Pt"];
const NAZWY = { et: "Et.", relew: "Rel.ew.", relkat: "Rel.kat", rel: "Rel.", wf: "WF", edb: "EDB", zajksztkr: "Zaj.kszt.kr", zajkr: "Zaj.kr", roselkul: "Ros.el.kul" };
const nazwa = s => NAZWY[s] || s.charAt(0).toUpperCase() + s.slice(1);
const sala = r => !r || r.startsWith("GYM") ? "" : r;
let plan = "hard", widok = "oddzial", wybor = null, grupy = {};

function zapisz(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function wczytaj(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

const klucz = l => [l.req, l.day, l.period, l.dur].join("|");
const obecne = new Set(D.plans.real.map(klucz));
const oddzialy = Object.keys(D.splits).sort((a, b) => a.localeCompare(b, "pl", { numeric: true }));
const nauczyciele = [...new Set(D.plans.real.map(l => l.teacher))].sort((a, b) => a.localeCompare(b, "pl"));

function opcje(sel, lista, pusta) {
  sel.innerHTML = "";
  sel.append(new Option(pusta, ""));
  for (const x of lista) sel.append(new Option(x, x));
}
const selOddzial = document.getElementById("sel-oddzial");
const selNauczyciel = document.getElementById("sel-nauczyciel");
opcje(selOddzial, oddzialy, "– wybierz oddział –");
opcje(selNauczyciel, nauczyciele, "– wybierz nauczyciela –");

function grupaLabel(g) { const [s, t] = g.split("/"); return t ? `${nazwa(s)} (${t})` : g; }

function rysujGrupy() {
  const box = document.getElementById("grupy");
  box.innerHTML = "";
  if (widok !== "oddzial") return;
  for (const [split, nazwyGrup] of Object.entries(D.splits[wybor] || {})) {
    const col = document.createElement("div");
    col.className = "col-sm-6 col-lg-3";
    const id = "grupa-" + split.replace(/[^\w]/g, "_");
    col.innerHTML = `<label for="${id}" class="d-block mb-1">Grupa: ${split.split("+").map(nazwa).join(" / ")}</label>`;
    const sel = document.createElement("select");
    sel.className = "form-select"; sel.id = id;
    sel.append(new Option("cała klasa", ""));
    for (const g of nazwyGrup) if (!g.startsWith("rest")) sel.append(new Option(g.split("+").map(grupaLabel).join(" + "), g));
    sel.value = grupy[split] || "";
    sel.addEventListener("change", () => { grupy[split] = sel.value; rysujPlan(); });
    col.append(sel);
    box.append(col);
  }
}

function widoczna(l) {
  if (widok === "nauczyciel") return l.teacher === wybor;
  const moje = l.groups.filter(g => g[0] === wybor);
  if (!moje.length) return false;
  return moje.some(([, split, nazwaGr]) => !split || !grupy[split] || grupy[split] === nazwaGr);
}

function komorka(lekcje) {
  if (!lekcje.length) return { html: "", zmiana: false };
  const zmiana = plan !== "real" && lekcje.some(l => !obecne.has(klucz(l)));
  if (widok === "nauczyciel") {
    const l = lekcje[0];
    const klasy = [...new Set(l.groups.map(g => g[0]))].join(", ");
    return { html: `${nazwa(l.subject)}<br>&nbsp; ${klasy}<br>&nbsp; ${sala(l.room)}`, zmiana };
  }
  const czesc = lekcje.length === 1 && lekcje[0].groups.some(g => g[0] === wybor && g[1]);
  const kon = czesc ? "/" : "";
  const s = lekcje.map(l => nazwa(l.subject)).join("/") + kon;
  const t = lekcje.map(l => l.teacher).join("/") + kon;
  const r = lekcje.map(l => sala(l.room)).join("/") + kon;
  return { html: `${s}<br>&nbsp; ${t}<br>&nbsp; ${r}`, zmiana };
}

function rysujPlan() {
  const tab = document.getElementById("plan");
  const tytul = document.getElementById("tytul");
  if (!wybor) { tab.innerHTML = ""; tytul.textContent = "Plan lekcji"; return; }
  const siatka = Array.from({ length: 10 }, () => Array.from({ length: 5 }, () => []));
  for (const l of D.plans[plan]) if (widoczna(l))
    for (let p = l.period; p < l.period + l.dur; p++) siatka[p][l.day].push(l);
  const uzyte = siatka.map(w => w.some(c => c.length));
  const od = Math.min(1, uzyte.indexOf(true)), doo = Math.max(8, uzyte.lastIndexOf(true));
  let html = '<thead><tr height="60" valign="middle" align="center"><th scope="col">Nr</th>' + DNI.map(d => `<th scope="col">${d}</th>`).join("") + "</tr></thead><tbody>";
  for (let p = od; p <= doo; p++) {
    html += `<tr align="center" valign="middle"><th scope="row">${GODZ[p]}</th>`;
    for (let d = 0; d < 5; d++) {
      const k = komorka(siatka[p][d]);
      html += `<td${k.zmiana ? ' class="zmiana"' : ""}>${k.html}</td>`;
    }
    html += "</tr>";
  }
  tab.innerHTML = html + "</tbody>";
  const wybraneGrupy = widok === "oddzial" ? Object.values(grupy).filter(Boolean) : [];
  tytul.textContent = `Plan lekcji - ${wybor}` + (wybraneGrupy.length ? " (wybrane grupy)" : "");
  document.getElementById("legenda").hidden = plan === "real";
}

function ustawPlan(p) {
  plan = p; zapisz("pl-plan", p);
  document.querySelectorAll(".btn-plan").forEach(b => b.classList.toggle("active", b.dataset.plan === p));
  rysujPlan();
}
function wybierzOddzial(o) {
  widok = "oddzial"; wybor = o || null; grupy = {};
  selNauczyciel.value = ""; selOddzial.value = o || "";
  zapisz("pl-wybor", "o:" + (o || ""));
  rysujGrupy(); rysujPlan();
}
function wybierzNauczyciela(t) {
  widok = "nauczyciel"; wybor = t || null;
  selOddzial.value = ""; selNauczyciel.value = t || "";
  zapisz("pl-wybor", "n:" + (t || ""));
  rysujGrupy(); rysujPlan();
}
document.querySelectorAll(".btn-plan").forEach(b => b.addEventListener("click", () => ustawPlan(b.dataset.plan)));
selOddzial.addEventListener("change", () => wybierzOddzial(selOddzial.value));
selNauczyciel.addEventListener("change", () => wybierzNauczyciela(selNauczyciel.value));

ustawPlan(wczytaj("pl-plan") === "real" ? "real" : "hard");
const zapisany = wczytaj("pl-wybor") || "o:1A";
if (zapisany.startsWith("n:") && nauczyciele.includes(zapisany.slice(2))) wybierzNauczyciela(zapisany.slice(2));
else wybierzOddzial(oddzialy.includes(zapisany.slice(2)) ? zapisany.slice(2) : "1A");
</script>
